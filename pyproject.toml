[build-system]
requires = ["setuptools>=77"]   # 77+ for the SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "caokit"
version = "0.3.0.dev0"
description = "Chain-of-command agent company kit for CAO (cli-agent-orchestrator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []              # stdlib only (tomllib is in 3.11+)
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Armando Zubillaga" }]
keywords = ["ai-agents", "multi-agent", "agent-orchestration", "claude-code", "coding-agents", "cli", "tmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/ajzpiv97/cao-kit"
Repository = "https://github.com/ajzpiv97/cao-kit"
Changelog = "https://github.com/ajzpiv97/cao-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/ajzpiv97/cao-kit/issues"

[project.scripts]
caokit = "caokit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caokit = ["data/**/*"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.10", "coverage>=7", "bump-my-version>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"         # lint against the oldest supported Python
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D"]
ignore = ["D203", "D213"]       # D203/D213 conflict with the Google convention's D211/D212

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]                # tests are named descriptively; no docstring noise
"scripts/validate_e2e.py" = ["D", "E501", "SIM115"]  # legacy live-agent harness: style-only rules

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"          # same floor as requires-python and ruff
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false    # test methods are not worth a "-> None" each
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true        # but their bodies are still checked

[tool.bumpversion]
current_version = "0.3.0.dev0"
# PEP 440: 0.3.0.dev0 -> 0.3.0.dev1 -> 0.3.0.rc0 -> 0.3.0
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:\\.?(?P<pre_l>dev|rc)(?P<pre_n>0|[1-9]\\d*))?
"""
serialize = ["{major}.{minor}.{patch}.{pre_l}{pre_n}", "{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
message = "Release v{new_version}"

[tool.bumpversion.parts.pre_l]
values = ["dev", "rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/caokit/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
